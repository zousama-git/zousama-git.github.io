<!DOCTYPE html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vezzy!</title>
  <link rel="icon" type="image/ico" href="assets/logo.ico">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <button id="theme-toggle" aria-label="Toggle light mode" title="Toggle theme">
    <img src="assets/sun.svg" class="icon-sun" alt="Sun" width="24" height="24">
    <img src="assets/moon.svg" class="icon-moon" alt="Moon" width="24" height="24">
  </button>

  <script>
    const toggleButton = document.getElementById('theme-toggle');

    toggleButton.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
    });
  </script>

</body>
</html>
